<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DANEX ROYAL v11.0</title>
    <style>
        :root { --gold: #d4af37; --purple: #2d134d; --dark: #1a0a2e; --text: #f1e1ff; }
        body { margin: 0; background: var(--dark); color: var(--text); font-family: sans-serif; overflow: hidden; }
        #auth-gate { position: fixed; inset: 0; background: var(--dark); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .auth-box { background: var(--purple); padding: 40px; border-radius: 20px; border: 2px solid var(--gold); text-align: center; width: 320px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid var(--gold); color: #fff; border-radius: 8px; box-sizing: border-box; }
        .btn-gold { background: var(--gold); color: #000; border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 8px; text-transform: uppercase; }
        header { height: 70px; background: var(--purple); border-bottom: 2px solid var(--gold); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; }
        .ava-btn { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--gold); cursor: pointer; background-size: cover; background-position: center; background-color: #333; }
        main { display: flex; height: calc(100vh - 72px); }
        aside { width: 200px; background: rgba(0,0,0,0.3); padding: 20px; border-right: 1px solid #333; }
        .nav-link { background: none; border: none; color: #fff; width: 100%; text-align: left; padding: 12px; cursor: pointer; border-radius: 5px; margin-bottom: 5px; }
        .nav-link:hover { background: var(--purple); color: var(--gold); }
        .content { flex: 1; padding: 30px; overflow-y: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: var(--purple); padding: 20px; border-radius: 15px; border: 1px solid #444; }
        #drop-menu { position: absolute; top: 65px; right: 30px; background: var(--purple); border: 1px solid var(--gold); border-radius: 10px; width: 180px; display: none; z-index: 100; }
        #drop-menu div { padding: 12px; cursor: pointer; border-bottom: 1px solid #444; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 5000; }
        .modal-box { background: var(--purple); padding: 30px; border-radius: 15px; border: 2px solid var(--gold); width: 350px; }
    </style>
</head>
<body>

    <div id="auth-gate">
        <div class="auth-box">
            <h1 style="color:var(--gold); font-family:serif;">DANEX</h1>
            <input type="text" id="u-name" placeholder="Никнейм">
            <input type="password" id="u-pass" placeholder="Пароль">
            <button class="btn-gold" onclick="handleLogin()">ВОЙТИ</button>
            <p onclick="handleReg()" style="color:var(--gold); cursor:pointer; margin-top:15px; font-size:12px;">РЕГИСТРАЦИЯ</p>
            <button onclick="localStorage.clear(); location.reload();" style="background:none; border:none; color:red; margin-top:20px; cursor:pointer; font-size:10px;">СБРОСИТЬ БАЗУ (ЕСЛИ НЕ ЗАХОДИТ)</button>
        </div>
    </div>

    <header>
        <div style="font-size:24px; color:var(--gold); font-weight:bold;">DANEX</div>
        <div style="display:flex; align-items:center; gap:20px;">
            <div style="color:var(--gold); font-weight:bold;" id="ui-bal">0 d-c</div>
            <div class="ava-btn" id="ui-ava" onclick="toggleMenu()"></div>
        </div>
    </header>

    <div id="drop-menu">
        <div onclick="openModal('mod-lot')">💎 Выставить лот</div>
        <div onclick="openModal('mod-ava')">🖼 Сменить аву</div>
        <div onclick="renderTab('inv')">🎒 Инвентарь</div>
        <div onclick="location.reload()">🚪 Выход</div>
    </div>

    <main>
        <aside>
            <button class="nav-link" onclick="renderTab('market')">🏠 Маркет</button>
            <button class="nav-link" onclick="renderTab('wheel')">🎡 Колесо</button>
            <button class="nav-link" onclick="renderTab('chat')">💬 Чат</button>
        </aside>
        <div class="content" id="view"></div>
    </main>

    <div id="mod-lot" class="modal"><div class="modal-box">
        <h3>НОВЫЙ ЛОТ</h3>
        <input id="n-name" placeholder="Название"><input type="number" id="n-price" placeholder="Цена">
        <input type="number" id="n-step" placeholder="Шаг"><input type="number" id="n-time" placeholder="Время (мин)">
        <button class="btn-gold" onclick="addLot()">СОЗДАТЬ</button>
        <button onclick="closeModal('mod-lot')" style="color:#aaa; background:none; border:none; width:100%; margin-top:10px;">Отмена</button>
    </div></div>

    <div id="mod-ava" class="modal"><div class="modal-box">
        <h3>АВАТАРКА</h3>
        <input id="n-ava" placeholder="URL картинки">
        <button class="btn-gold" onclick="setAva()">СОХРАНИТЬ</button>
        <button onclick="closeModal('mod-ava')" style="color:#aaa; background:none; border:none; width:100%; margin-top:10px;">Закрыть</button>
    </div></div>

    <script>
        let db, me;

        // ПРИНУДИТЕЛЬНАЯ ЗАГРУЗКА
        function loadDB() {
            let raw = localStorage.getItem('danex_v11');
            db = raw ? JSON.parse(raw) : {
                users: {"Даня": {p: "123", b: 1000000, a: ""}},
                lots: [], chat: [], inv: {}, nextId: 0
            };
            // Исправление старой базы
            if (db.nextId === undefined) db.nextId = 0;
            if (!db.chat) db.chat = [];
        }

        function save() { localStorage.setItem('danex_v11', JSON.stringify(db)); }

        function handleLogin() {
            loadDB();
            const u = document.getElementById('u-name').value;
            const p = document.getElementById('u-pass').value;
            if (db.users[u] && db.users[u].p === p) {
                me = u; document.getElementById('auth-gate').style.display = 'none'; startApp();
            } else { alert("Неверно!"); }
        }

        function handleReg() {
            loadDB();
            const u = document.getElementById('u-name').value;
            const p = document.getElementById('u-pass').value;
            if(!u || !p) return;
            if(db.users[u]) return alert("Занят!");
            db.users[u] = {p: p, b: 5000, a: ""};
            db.inv[u] = []; save(); alert("ОК! Входи.");
        }

        function startApp() {
            refresh(); renderTab('market'); setInterval(logic, 1000);
            if(me === "Даня") {
                let d = document.createElement('div'); d.style = "position:fixed; bottom:0; width:100%; background:red; text-align:center; z-index:9999;";
                d.innerHTML = `<button onclick="db.users[me].b+=1000000; save(); refresh();">АДМИН +1М</button>`;
                document.body.appendChild(d);
            }
        }

        function refresh() {
            document.getElementById('ui-bal').innerText = db.users[me].b.toLocaleString() + " d-c";
            document.getElementById('ui-ava').style.backgroundImage = `url('${db.users[me].a || 'https://placeholder.com'}')`;
        }

        function renderTab(t) {
            const v = document.getElementById('view'); v.innerHTML = "";
            if(t==='market') { v.innerHTML = `<h2>МАРКЕТ</h2><div class="grid" id="m-grid"></div>`; drawMarket(); }
            if(t==='wheel') { v.innerHTML = `<div style="text-align:center"><h2>КОЛЕСО</h2><div id="w-res" style="font-size:80px; margin:30px">🎰</div><button class="btn-gold" style="width:200px" onclick="spin()">КРУТИТЬ (1000)</button></div>`; }
            if(t==='chat') { v.innerHTML = `<h2>ЧАТ</h2><div id="c-box" style="height:300px; background:#111; overflow-y:auto; padding:10px; margin-bottom:10px"></div><input id="c-in" placeholder="Сообщение..."><button class="btn-gold" onclick="sendMsg()">ОТПРАВИТЬ</button>`; drawChat(); }
            if(t==='inv') { v.innerHTML = `<h2>ИНВЕНТАРЬ</h2><div class="grid" id="i-grid"></div>`; drawInv(); }
        }

        function drawMarket() {
            const g = document.getElementById('m-grid'); if(!g) return; g.innerHTML = "";
            db.lots.forEach((l, i) => {
                g.innerHTML += `<div class="card"><b>${l.n}</b><br><small>ID: #${l.id} | ${l.o}</small><br><span id="t-${i}" style="color:red">⏳ --:--</span><br><div style="color:var(--gold); margin:10px 0">${l.pr.toLocaleString()} d-c</div><button class="btn-gold" onclick="bid(${i})">${l.o===me?'МОЙ':'СТАВКА'}</button></div>`;
            });
        }

        function addLot() {
            const n=document.getElementById('n-name').value, p=parseInt(document.getElementById('n-price').value), t=parseFloat(document.getElementById('n-time').value), s=parseInt(document.getElementById('n-step').value)||10;
            if(!n || !p || !t) return;
            db.lots.push({ id: db.nextId++, n: n, pr: p, st: s, o: me, et: Date.now()+(t*60000), lb: null });
            save(); closeModal('mod-lot'); renderTab('market');
        }

        function logic() {
            const now = Date.now();
            db.lots.forEach((l, i) => {
                const diff = l.et - now; const el = document.getElementById(`t-${i}`);
                if(diff <= 0) {
                    const win = l.lb || l.o; if(!db.inv[win]) db.inv[win] = [];
                    db.inv[win].push(l); db.lots.splice(i, 1); save(); renderTab('market');
                } else if(el) {
                    const m = Math.floor(diff/60000), s = Math.floor((diff%60000)/1000);
                    el.innerText = `⏳ ${m}:${s<10?'0':''}${s}`;
                }
            });
        }

        function bid(i) {
            const l = db.lots[i]; if(l.o===me || l.lb===me) return alert("Нельзя перебить себя!");
            const cost = l.pr + l.st;
            if(db.users[me].b >= cost) {
                if(l.lb && db.users[l.lb]) db.users[l.lb].b += l.pr;
                db.users[me].b -= cost; l.pr = cost; l.lb = me; save(); refresh(); drawMarket();
            } else alert("Мало d-c");
        }

        function spin() {
            if(db.users[me].b < 1000) return alert("Мало d-c");
            db.users[me].b -= 1000; const ps = [0, 500, 1000, 10000, 100000, 50000, 25000];
            const r = document.getElementById('w-res'); let c = 0;
            const a = setInterval(() => {
                r.innerText = ps[Math.floor(Math.random()*ps.length)];
                if(c++ > 15) { clearInterval(a); const w = ps[Math.floor(Math.random()*ps.length)]; r.innerText = w; db.users[me].b += w; save(); refresh(); }
            }, 50);
        }

        function sendMsg() {
            const i = document.getElementById('c-in'); if(!i.value) return;
            db.chat.push({u: me, t: i.value}); save(); i.value = ""; drawChat();
        }

        function drawChat() {
            const b = document.getElementById('c-box'); if(!b) return;
            b.innerHTML = db.chat.map(m => `<div><b>${m.u}:</b> ${m.t}</div>`).join('');
            b.scrollTop = b.scrollHeight;
        }

        function drawInv() {
            const g = document.getElementById('i-grid'); const items = db.inv[me] || [];
            g.innerHTML = items.map(it => `<div class="card"><b>${it.n}</b><br><small>ID: #${it.id}</small></div>`).join('');
        }

        function toggleMenu() { const m = document.getElementById('drop-menu'); m.style.display = (m.style.display==='block')?'none':'block'; }
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function setAva() { db.users[me].a = document.getElementById('n-ava').value; save(); refresh(); closeModal('mod-ava'); }
    </script>
</body>
</html>
